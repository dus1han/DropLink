# Builds DropLink installers for macOS (universal: Apple Silicon + Intel) and
# Windows x64. Run it from the Actions tab ("Run workflow") or by pushing a tag
# like v1.0.0. Installers are attached to the run as artifacts and, for tags,
# to a GitHub release that is published once both platforms have uploaded.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (the updater signing key; its
# password secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be left unset).
# Release: bump the version (npm run release -- 1.0.1) and push the tag.
#
# Optional Apple signing secrets (unsigned builds work without them):
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # For tags: one draft release that both platform builds upload into. Letting
  # each build create the release itself races (the second job fails with
  # "Not Found" listing release assets), and a draft keeps installed apps from
  # seeing a half-uploaded release.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `DropLink ${tag}`,
              body: "See the commits since the previous release for what changed.",
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    # Also runs for manual builds, where create-release is skipped.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Test engine
        run: cargo test -p droplink-core

      # Tauri treats a set-but-empty APPLE_* variable as a request to sign, so
      # export only the secrets that exist. Without a signing identity the app
      # is ad-hoc signed ("-"), which Apple Silicon requires to launch it.
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"; fi

      # Update packages are signed with TAURI_SIGNING_PRIVATE_KEY (repository
      # secret); installed apps verify them against the public key in
      # tauri.conf.json. For tags the packages and latest.json go into the
      # draft release; manual runs only produce workflow artifacts.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: droplink-${{ matrix.platform }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publish only once every platform has uploaded; from then on installed
  # copies find it through releases/latest/download/latest.json.
  publish-release:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: "true",
            });
